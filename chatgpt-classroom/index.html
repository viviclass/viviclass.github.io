<div class="app" id="app"><div class="menubg hidden" id="menubg"></div><aside class="sidebar" id="sidebar"><div class="side-top"><div class="brand"><span class="brandleft"><span class="round-logo">✳</span>ChatGPT</span><button class="plain-icon" data-act="collapse" aria-label="收合選單">☷</button></div></div><div class="sidegroup" id="navtop"></div><div class="side-scroll" id="navrest"></div><div class="profile"><button class="nav" data-act="profile" title="設定與個人化"><span class="avatar">⚙</span><span>學員示範 · 設定</span><small>⋯</small></button></div></aside><main class="main"><header class="top"><div class="top-left"><button data-act="menu" class="mobile-trigger" aria-label="開啟選單">☰</button><span class="top-label" id="top-title">ChatGPT</span><span style="color:#777">⌄</span></div><div class="toggle"><button data-act="chat" id="chatTab" class="selected">Chat</button><button data-act="work" id="workTab">Work</button></div><div class="top-right"><button class="mobile-project" data-act="openproject" aria-label="開啟右側專案入口" title="專案入口">▣</button><button class="header-notion" data-act="notion" title="綁定 Notion 教學">▣ <span>綁定 Notion</span></button><span class="teacher-label">教學模擬</span><button data-act="new" title="新增對話" aria-label="新增對話">✎</button></div></header><div class="main-body"><div class="center" id="content"></div><div class="right-dim hidden" id="right-dim" data-act="closeproject"></div><aside class="right-rail" id="right-rail" aria-label="專案入口"><div class="rail-header"><h3>專案入口</h3><button class="plain-icon mobile-trigger" data-act="closeproject" aria-label="關閉專案入口">✕</button></div><p class="rail-kicker">先看 Notion 連接教學，再進入模擬授權</p><button class="project-entry" id="notion-card" data-act="notion"><span class="project-icon">▣</span><strong>綁定 Notion｜教學＋練習</strong><span>按這裡看官方連接教學，再練習授權與讀取驗證</span></button><button class="project-entry" id="settings-card" data-act="settings"><span class="project-icon">⚙</span><strong>基礎設定｜記憶與個人化</strong><span>認識記憶、風格偏好、自訂指示、參考圖片及資料控制</span></button><div class="rail-note">此入口為 ViVi 教學加設的模擬專案，不是 ChatGPT 官方固定按鈕。</div></aside></div><div class="footer">ChatGPT 教學模擬 · 非官方服務 · 這裡的輸入不會送到 ChatGPT</div><div class="lesson-pill" id="lesson-count">已探索 0 / 9</div><div class="coach hidden" id="coach"><div class="coach-head"><span class="dot">✳</span>功能導覽老師 <button data-act="togglecoach" aria-label="展開或收合解說">說明</button><button data-act="closecoach" aria-label="關閉解說">×</button></div><div class="coach-body"><p class="coach-title" id="ctitle"></p><p class="coach-desc" id="cdesc"></p><div class="coach-example" id="cexample"></div><div class="coach-actions"><span class="count" id="ccount">已探索 0 個</span><div style="display:flex;gap:7px"><button data-act="speak">🔊 聽解說</button><button data-act="next">下一個 →</button></div></div></div></div></main><div class="shade hidden" id="searchOverlay"><div class="searchmodal"><div class="searchbar"><span>⌕</span><input id="searchInput" aria-label="搜尋示範對話" placeholder="搜尋聊天紀錄"><button data-act="closesearch" class="plain-icon">✕</button></div><div class="searchresults"><div>最近的對話（示範）</div><div id="results"></div></div></div></div></div>
<script>
(()=>{'use strict';
const glyph={new:'✎',search:'⌕',images:'▧',mentions:'@',slash:'/',plugins:'▦',gpts:'◈',projects:'▤',library:'▤',codex:'⌘',history:'◷',profile:'⚙',chat:'◌',work:'✧',voice:'♬',notion:'▣'};
const lessons={
new:{title:'新增對話',desc:'開始全新的聊天。同一個主題也可以在原本對話繼續追問。',example:'試試輸入：「幫我安排明天的三件重要工作」。'},
search:{title:'搜尋聊天紀錄',desc:'在以前的聊天中找資訊，不是搜尋網際網路。',example:'搜尋「日常進度」，打開之前的示範對話。'},
images:{title:'圖片',desc:'可以使用支援的圖片功能生成或編輯圖片。GIF 運用與「我的魔法咒語」是本教室另外整理的示範教學，不代表 ChatGPT 一定有這兩個官方入口。',example:'示例：「製作一張 9:16 的粉色 AI 課程海報」。'},
gif:{title:'GIF 運用',desc:'示範把靜態角色照片變成短時間循環動圖，例如自然揮手與眨眼。這裡不會真的生成 GIF。',example:'提示詞：「人物輕揮手、自然眨眼，做 3 秒無縫循環 GIF」。'},
magic:{title:'我的魔法咒語',desc:'常用提示詞庫範例。可以把人物一致性、繁體中文、畫面比例與風格要求整理成可重複使用的指令。',example:'示例：「保留原人物五官，生成 9:16 奶油粉 AI 課程主視覺」。'},
mentions:{title:'@ 提及功能',desc:'在支援的 ChatGPT 網頁介面，可以用 @ 提及可用的 GPT 或已連接應用程式。@ 不是一般網路搜尋，也不代表 Notion 已自動連線。',example:'輸入 @ 並在選單中選擇可用的 GPT 或應用程式（依帳號而異）。'},
slash:{title:'/ 工具與指令',desc:'在輸入框輸入 /，顯示目前對話可用的工具與快捷指令，例如搜尋。可用指令依裝置、方案與環境不同。',example:'輸入 /，再選擇搜尋（如果你的帳號選單有顯示）。'},
model:{title:'模型與設定示意',desc:'此處僅模擬模型選單位置，無法真正切換模型。不同方案的選項不同。',example:'選擇適合的對話模式，再交給 ChatGPT 任務。'},
voice:{title:'語音功能',desc:'可用語音與 AI 對話，也能將語音內容整理成文字與重點。AI 可能依聲音特徵推測語氣或說話年齡感，但不是可靠的身分或年齡鑑定。此處僅模擬示範，沒有實際收音或判讀。',example:'在語音範例頁切換「大人／小孩」及語氣，看看回覆示例。'},
plugins:{title:'Plugins／應用程式',desc:'外部工具與連線能力依帳號、權限及服務而異。',example:'本模擬教室在右側加入了「Notion 綁定」的練習入口。'},
gpts:{title:'GPTs',desc:'探索針對特定任務設定的 GPT，與一般聊天不同。',example:'用於寫作、學習或教學任務。'},
projects:{title:'專案',desc:'把同主題的聊天、檔案和指示放在一起管理。',example:'例如「日常進度安排」與「主管交代事項」。'},
notion:{title:'綁定 Notion｜教學與模擬',desc:'獨立入口會先教你從 ChatGPT 設定打開 Plugins，選擇 Notion、連接、授權與確認已授權來源，再進入模擬練習。這裡不會真的登入或連線。',example:'先閱讀「官方操作步驟」，再按「開始互動練習」，最後完成模擬讀取驗證。'},
library:{title:'檔案庫',desc:'查看或整理已保存的資料與素材；項目依帳號版本可能不同。',example:'找出之前使用的 PDF 或圖片。'},
codex:{title:'Codex',desc:'協助開發、修改和測試程式。',example:'修正網站程式錯誤。'},
history:{title:'歷史對話',desc:'找回之前的聊天並繼續討論。',example:'開啟「主管交代事項」示範對話。'},
chat:{title:'Chat（對話）',desc:'適合快速問答、寫作、整理思路與逐步追問。',example:'把一則提醒改成適合 LINE 發送的訊息。'},
work:{title:'Work（工作）',desc:'適合較長、多步驟的工作。是否可用依帳號方案而異。',example:'整理多份資料，產出一份可交付報告。'},
profile:{title:'帳號與設定',desc:'這裡可以查看個人化和資料控制等帳號選項；名稱與位置依實際版本。',example:'讓 ChatGPT 預設使用繁體中文。'}
};
const order=['new','search','images','voice','mentions','slash','plugins','projects','gpts','library','codex','notion','work','profile'];
const visited=new Set();let current='home', mode='chat', coachKey='chat', notionStep=0, notionMode='guide', voiceSample=0,voiceMood=0, notionPages=[true,false], commandMode=null, selectedChat='日常進度安排', selectedMagic=null, memoryDemo=false;
const promptMap={
 '整理學習筆記':'請把我貼上的內容整理成一份新手易讀的學習筆記，分成「主題、3個重點、操作範例、下次複習清單」，以繁體中文輸出。如果資料不足，請先問我。',
 '日常進度安排':'請協助我整理今天的行程與待辦。我會貼上事情清單，請幫我按「優先處理、今天完成、可以延後」分類，排出合理順序；沒有提供時間的項目請先標示待確認，不要編造。',
 'ChatGPT 入門講義':'請把以下資料整理成 ChatGPT 新手講義，包含「這個功能是什麼、去哪裡點、跟著做3步驟、生活應用例子、完成檢查」。使用簡單的繁體中文，不要假設每個帳號都有相同功能。',
 '主管交代事項':'請將我貼上的主管交辦事項整理成表格，包含「事項、負責人、截止日、優先順序、目前狀態、需要確認的問題」。沒有提供的資訊請標註待確認，最後列出今天必須先做的3件事。',
 '課程招生文案':'請根據我提供的課程資料，寫一段繁體中文的招生文案，清楚說明對象、學習成果與報名方式。未提供日期、價格與網址時不要自行編造。',
 '我的第一個 AI 網站':'請協助我規劃個人介紹網站，先詢問網站用途、想放的內容與風格，再產生首頁標題、關於我、服務介紹和聯絡方式的簡短草稿。'
};
function promptTip(title){const text=promptMap[title];return text?`<div class="prompt-tip"><h3>✨ ${esc(title)}｜簡單魔法咒語</h3><p>${esc(text)}</p><div class="prompt-actions"><button data-act="fillprompt" data-value="${esc(title)}">放入對話框</button><button data-act="copyprompt" data-value="${esc(title)}">複製咒語</button></div></div>`:'';}
function historyItem(title){return `<button class="nav ${current==='history'&&selectedChat===title?'active':''}" data-act="history" data-value="${esc(title)}"><span class="sym">◷</span><span>${esc(title)}</span></button>`;}
function projectItem(title){return `<button class="nav" data-act="projectprompt" data-value="${esc(title)}"><span class="sym">▤</span><span>${esc(title)}</span></button>`;}

const el=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function item(key,title){return `<button class="nav ${current===key?'active':''}" data-act="${key}"><span class="sym">${glyph[key]||'•'}</span><span>${title}</span></button>`;}
function drawNav(){
  el('navtop').innerHTML=[item('new','新增對話'),item('search','搜尋聊天紀錄'),item('images','圖片'),item('voice','語音'),item('plugins','Plugins'),item('notion','綁定 Notion｜教學'),item('codex','Codex')].join('');
  const n=el('navtop').querySelector('[data-act="notion"]');if(n)n.classList.add('special');
  el('navrest').innerHTML=`<div class="groupname">專案 <span style="float:right">＋</span></div>${item('projects','新增專案')}${projectItem('日常進度安排')}${projectItem('主管交代事項')}<div class="groupname">GPTs</div>${item('gpts','探索 GPTs')}<div class="groupname">最近的對話</div>${historyItem('ChatGPT 入門講義')}${historyItem('日常進度安排')}${historyItem('主管交代事項')}<div class="groupname">更多功能</div>${item('library','檔案庫')}`;
  el('notion-card').classList.toggle('active',current==='notion');el('settings-card').classList.toggle('active',current==='settings');
}

function compose(placeholder='詢問任何問題'){
  return `<div class="compose">
    <textarea id="prompt" rows="2" placeholder="${placeholder}" aria-label="模擬輸入框"></textarea>
    <div class="tools"><div class="left">
      <button class="mini-round" data-act="attach" aria-label="附加檔案">＋</button>
      <button class="toolchip markup" data-act="mentionmenu" title="@ 提及 GPT／應用程式" aria-label="@ 功能選單">@</button>
      <button class="toolchip markup" data-act="slashmenu" title="/ 開啟工具與指令" aria-label="斜線指令選單">/</button>
      <button class="toolchip" data-act="images">▧ 圖片</button></div>
      <div class="right"><button class="toolchip" data-act="model">GPT-6⌄</button><button class="mini-round" data-act="voice" aria-label="語音功能">🎙</button><button class="mini-round dark" data-act="send" aria-label="送出模擬訊息">↑</button></div>
    </div>
    <div class="toolhint">點 <b>@</b> 看提及與功能示例　·　點 <b>/</b> 看官方工具／ViVi 自訂快捷語法（教學模擬）</div>
    <div class="cmd-pop hidden" id="command-pop" aria-label="輸入框功能選單"><div class="cmd-header"><strong id="command-title"></strong><button data-act="closecommand" aria-label="關閉功能選單">✕</button></div><div id="command-content"></div></div>
  </div>`;
}

function closeCommand(){commandMode=null;const p=el('command-pop');if(p)p.classList.add('hidden')}
function openCommand(kind){
  const pop=el('command-pop');if(!pop)return;
  const type=kind==='mention'?'mention':'slash'; commandMode=type;visited.add(type==='mention'?'mentions':'slash');el('lesson-count').textContent=`已探索 ${visited.size} / ${order.length}`;
  el('coach').classList.add('hidden');
  el('command-title').textContent=type==='mention'?'@｜提及、選擇功能與參考對象':'/｜工具選單與 ViVi 自訂快捷語法';
  el('command-content').innerHTML=type==='mention'?`
    <button class="cmd-row" data-act="commandselect" data-value="mention-image"><strong>@ 製作圖像｜課堂示範</strong><small>練習生成課程海報；正式使用時請從實際功能選單選擇製作圖片。</small></button>
    <button class="cmd-row" data-act="commandselect" data-value="mention-research"><strong>@ 深入研究｜課堂示範</strong><small>練習資料比較；正式使用時請選擇帳號實際支援的研究工具。</small></button>
    <button class="cmd-row" data-act="commandselect" data-value="mention-skill"><strong>@ 技能名稱｜自訂範例</strong><small>例：@小廢片導演。僅在該帳號或環境已建立、可用時才可能呼叫；打文字不會自動安裝技能。</small></button>
    <button class="cmd-row" data-act="commandselect" data-value="mention-photo"><strong>@ 照片名稱｜參考圖範例</strong><small>例：@心心。需要帳號已有可用參考圖與正確引用方式，否則只是文字。</small></button>
    <div class="cmd-foot">實際 ChatGPT 的 @ 選單依帳號而定，不能保證出現全部四項。這裡用教學例子區分「提及」與「執行工具」。</div>`:`
    <button class="cmd-row" data-act="commandselect" data-value="slash-feedback"><strong>/ 意見回饋｜ViVi 示範</strong><small>練習寫一段錯誤回報；正式的意見回饋請使用介面中的回報功能。</small></button>
    <button class="cmd-row" data-act="commandselect" data-value="slash-vivi"><strong>/ViVi｜自訂技能快捷語法</strong><small>ViVi 課堂自訂的工作流程提示範例，不是每個 ChatGPT 帳號內建指令。</small></button>
    <button class="cmd-row" data-act="commandselect" data-value="slash-workflow"><strong>/自訂流程｜工作流程咒語</strong><small>例如先整理重點，再分類、產出待辦與驗收；需要事先設計規則或技能才會自動執行。</small></button>
    <button class="cmd-row" data-act="commandselect" data-value="slash-search"><strong>/ 搜尋｜官方工具示例</strong><small>部分帳號可用斜線選擇內建工具；實際項目依帳號與版本。</small></button>
    <div class="cmd-foot">/ 在正式介面可用於工具選擇；/ViVi 和 /自訂流程是課堂命名慣例，不能單靠鍵入保證執行。</div>`;
  pop.classList.remove('hidden');
}
function prefill(text){current='home';mode='chat';render();const input=el('prompt');if(input){input.value=text;input.focus();input.setSelectionRange(text.length,text.length);} el('coach').classList.add('hidden');closeRail();closeMenu();}

function landing(iswork=false){return `<section class="home"><h1>${iswork?'我們要完成什麼工作？':'你今天想做些什麼？'}</h1>${compose(iswork?'描述想完成的工作':'詢問任何問題')}<div class="subchips">${(iswork?['整理待辦','統整資料','製作報告']:['建立圖片','@／ 指令教學','整理學習筆記','日常進度安排']).map(x=>`<button data-act="chip" data-value="${esc(x)}">${esc(x)}</button>`).join('')}</div>${selectedMagic?promptTip(selectedMagic):''}</section>`;}
function tiles(title,subtitle,items){return `<section class="view"><h2>${title}</h2><p class="subtitle">${subtitle}</p><div class="tiles">${items.map(x=>`<button class="tile" data-act="tile" data-key="${x[3]||current}"><span class="largeicon">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></button>`).join('')}</div></section>`;}
function renderVoice(){const s=voiceSample===0?{who:'大人（示範）',say:'今天下午兩點要開會，請幫我整理今天的進度。'}:{who:'小孩（示範）',say:'我想去坐透明纜車！可是又有一點點害怕。'};const mood=['平靜','開心','緊張'][voiceMood];return `<section class="view"><h2>語音</h2><p class="subtitle">使用語音對話、整理說話內容。下面是按鈕切換的預設範例，<strong>不是即時錄音或真的判別人聲</strong>。</p><div class="auth-card"><div class="auth-brand"><span class="auth-logo">🎙</span>語音功能示範</div><div class="auth-option"><span style="font-size:23px">◉</span><div><strong>示範文字稿</strong><div class="little">「${s.say}」</div></div></div><div class="auth-option"><span style="font-size:22px">◈</span><div><strong>可能的說話者：${s.who}</strong><div class="little">語氣範例：${mood}；這是預設標籤，不能作為身分判定</div></div></div><div class="auth-actions"><button class="auth-button" data-act="voiceperson">切換大人／小孩範例</button><button class="auth-button secondary" data-act="voicetone">切換語氣</button></div></div><p class="sim-label">提醒：現實使用時，AI 的聲音語氣推測可能出錯；不同裝置與版本支援情況可能不同。</p></section>`;}
function notionFlow(){

 if(a==='projectprompt'){selectedChat=btn.dataset.value||'日常進度安排';choose('history');return;}
 if(a==='memorydemo'){memoryDemo=!memoryDemo;render();return;}
 if(a==='settingprompt'){const key=btn.dataset.key;const t=key==='style'?'請預設使用繁體中文回答，優先給重點與清楚步驟。':key==='custom'?'我的自訂指示：用繁體中文、回答前先確認需求，不確定的地方請說明；操作教學請拆成可照做的步驟。':'請依我已授權可使用的參考相片生成 9:16 形象照，保留真實五官與年齡感。';prefill(t);return;}
 if(a==='prefill'){prefill(btn.dataset.value||'');return;}
 if(a==='notionpractice'){notionMode='practice';notionStep=0;current='notion';render();el('coach').classList.add('hidden');return;}
 if(a==='notionguide'){notionMode='guide';current='notion';render();return;}
 if(a==='model'){showCoach('model');return;}
 if(a==='menu'||a==='collapse'){const open=!el('sidebar').classList.contains('open');el('sidebar').classList.toggle('open',open);el('menubg').classList.toggle('hidden',!open);return;}if(a==='openproject'){showRail();return;}if(a==='closeproject'){closeRail();return;}if(a==='closecoach'){el('coach').classList.add('hidden');return;}if(a==='togglecoach'){el('coach').classList.toggle('compact');return;}if(a==='closesearch'){el('searchOverlay').classList.add('hidden');return;}if(a==='speak'){if(!('speechSynthesis' in window)||!lessons[coachKey])return;try{speechSynthesis.cancel();const l=lessons[coachKey];const u=new SpeechSynthesisUtterance(l.title+'。'+l.desc+'。'+l.example);u.lang='zh-TW';u.rate=.95;speechSynthesis.speak(u)}catch(e){}return;}if(a==='next'){const i=order.indexOf(coachKey);choose(order[(i+1)%order.length]);return;}if(a==='notionnext'){notionStep=notionStep>=5?0:Math.min(5,notionStep+1);render();return;}if(a==='notionback'){notionStep=Math.max(0,notionStep-1);render();return;}if(a==='notionpage'){return;}if(a==='voiceperson'){voiceSample=1-voiceSample;render();return;}if(a==='voicetone'){voiceMood=(voiceMood+1)%3;render();return;}if(a==='chip'){const key=btn.dataset.value;if(key==='@／ 指令教學'){openCommand('mention');return;}if(promptMap[key]){selectedMagic=key;render();el('coach').classList.add('hidden');return;}if(key==='建立圖片'){choose('images');return;}const input=el('prompt');if(input)input.value=key;return;}if(a==='tile'){const key=btn.dataset.key||current;if(['notion','gif','magic'].includes(key))choose(key);else showCoach(key);return;}if(a==='searchresult'){selectedChat=btn.dataset.value||'日常進度安排';el('searchOverlay').classList.add('hidden');choose('history');return;}if(a==='history'){selectedChat=btn.dataset.value||'日常進度安排';choose('history');return;}if(a==='send'){const input=el('prompt');if(input&&input.value.trim()){el('content').innerHTML=`<div class="mock-chat"><div class="bubble-user">${esc(input.value.trim())}</div><div class="bubble-assistant"><strong>ChatGPT · 教學模擬</strong><p>這裡沒有連接真正的 AI，所以只顯示教學用回覆。正式 ChatGPT 會依實際問題回答。</p><div class="tipbox">可繼續點左側功能，或按右側的 Notion 綁定專案入口。</div></div>${compose('這是教學模擬，不會真的發送訊息')}</div>`}else showCoach('chat');return;}if(a==='attach'){showCoach('chat');return;}if(lessons[a])choose(a);}
document.addEventListener('click', e => {
  if (!e.target.closest('.compose')) closeCommand();
  const button = e.target.closest('[data-act]');
  if (button) action(button.dataset.act, button);
  if (e.target === el('searchOverlay')) el('searchOverlay').classList.add('hidden');
  if (e.target === el('menubg')) closeMenu();
});
el('searchInput').addEventListener('input', e => search(e.target.value));
document.addEventListener('input',e=>{
  if(e.target.id!=='prompt')return;
  const m=e.target.value.match(/(?:^|\s)([@\/])[^\s]*$/);
  if(m)openCommand(m[1]==='@'?'mention':'slash'); else closeCommand();
});
document.addEventListener('change',e=>{
  if(e.target.matches('input[data-act="notionpage"]')){notionPages[Number(e.target.dataset.index)]=e.target.checked;render();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){el('searchOverlay').classList.add('hidden');closeMenu();closeRail();closeCommand();}if(e.key==='Enter'&&e.target.id==='prompt'&&!e.shiftKey){e.preventDefault();action('send');}});render();
})();
</script></body></html>
