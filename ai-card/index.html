<style>
:root{color-scheme:dark;--pink:#f309c6;--gold:#fbe18f;--ink:#170f22}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#4e205a 0%,#21132f 48%,#0d0a16 100%);color:#fff;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;padding:24px 13px 32px}

.deck{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:25px 0}
.tile{position:relative;aspect-ratio:3/4;border:0;padding:0;background:transparent;perspective:900px;cursor:pointer;min-width:0;-webkit-tap-highlight-color:transparent}
.tile:focus-visible{outline:3px solid #fbe18f;outline-offset:4px;border-radius:13px}
.inner{width:100%;height:100%;display:block;position:relative;transition:transform .5s;transform-style:preserve-3d}
.tile.flipped .inner{transform:rotateY(180deg)}
.side{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:15px;overflow:hidden}
.front{background:linear-gradient(145deg,#72216b,#39214e 60%,#1b1230);border:2px solid #d98cc9;box-shadow:0 10px 23px #03010680}
.front:before{content:"";position:absolute;inset:9px;border:1px solid #f0d38c8c;border-radius:10px}
.front .star{font-size:clamp(26px,7vw,48px);filter:drop-shadow(0 0 10px #ffe1f0)}
.front .num{font-size:13px;letter-spacing:.1em;color:#f9d7f4;margin-top:8px}
.back{background:linear-gradient(150deg,#fff9ee,#ffe1f2);transform:rotateY(180deg);color:#3f1641;border:2px solid #eac572;padding:7px}
.back .symbol{font-size:clamp(27px,6vw,46px)}.back .name{font-size:clamp(12px,2.9vw,18px);font-weight:800;margin-top:6px;color:#a50a87}
.hint{font-size:13px;color:#debbeb;margin:8px 0}
.result{border:1px solid #d98cc9;background:#ffffff12;padding:20px;border-radius:18px;margin:14px auto 0;max-width:640px;display:none}
.result.show{display:block}.result h2{color:var(--gold);font-size:25px;margin:4px 0}.result p{font-size:17px;color:white;margin:12px auto}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.action{appearance:none;border:0;border-radius:25px;background:var(--pink);color:#fff;font:700 15px system-ui,sans-serif;padding:12px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.action.alt{background:#f0e6ee;color:#3a2040}
.promo{border:1px solid #8d5c94;padding:20px 15px;border-radius:16px;margin:26px auto 0;background:#ffffff09}.promo strong{font-size:20px}.promo p{font-size:14px;margin:10px auto 16px}

@media(max-width:420px){.deck{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.side{border-radius:12px}.front .star{font-size:36px}.back .symbol{font-size:34px}.back .name{font-size:13px}}
@media(prefers-reduced-motion:reduce){.inner{transition:none}}
</style></head><body><main>
<header><small>薇光 AI 課堂 ✦ AI 造物局｜免費體驗</small><h1>✨ 今天的能量抽卡 ✨</h1><p>從 12 張卡片中，憑直覺選一張。<br>點一下翻開，也可以換張再抽。</p></header>
<section class="deck" id="deck" aria-label="12 張可翻開的能量卡"></section>
<p class="hint">👆 點任一張卡直接翻面，抽過的卡也能再點一次翻回</p>
<section id="result" class="result" aria-live="polite" aria-atomic="true"><h2 id="resultTitle"></h2><p id="resultText"></p>
<div class="actions"><button id="again" type="button" class="action alt">全部蓋回，重新抽</button><button id="share" type="button" class="action">分享抽卡結果</button></div></section>
<section class="promo"><strong>你也想做出自己的互動小程式嗎？</strong>

</main>
<script>
(function(){
"use strict";
var cards=[
["🌟","勇氣之光","你不必一次完成全部。今天只要跨出第一步，就值得為自己鼓掌。"],
["🌷","溫柔之心","慢一點也沒有關係。把自己照顧好，也是一種穩定前進的力量。"],
["🦋","轉變之翼","不必害怕新開始。你正在學會用不一樣的方式，創造更多可能。"],
["☀️","明亮之日","你已經擁有重要的能力，今天試著讓它們被看見。"],
["🌙","安靜之夜","感到疲倦時，休息不是退步。明天依然可以重新選擇。"],
["💎","獨特之美","不需要和別人一模一樣。你自己的節奏，就是你的特色。"],
["🍀","幸運萌芽","把注意力放在你能做到的小事，好機會往往從小行動開始。"],
["🌈","希望彩虹","今天或許不完美，但你可以替自己保留一點期待。"],
["🔥","行動火花","靈感很珍貴，現在就挑一件小事讓它變成現實。"],
["🪴","成長之根","今天學到的一點點，經過時間也會長成你的底氣。"],
["🧭","方向之星","先確認你想前往的方向，再選擇今天最重要的一步。"],
["🤍","連結之光","一份真誠的關心，可能就是某個人今天最需要的力量。"]
];
var deck=document.getElementById("deck"),result=document.getElementById("result"),latest=null;
cards.forEach(function(data,i){
var button=document.createElement("button");button.type="button";button.className="tile";button.setAttribute("aria-label","翻開第 "+(i+1)+" 張能量卡");button.setAttribute("aria-pressed","false");
var inner=document.createElement("span");inner.className="inner";
var front=document.createElement("span");front.className="side front";
var star=document.createElement("span");star.className="star";star.textContent="✦";
var num=document.createElement("span");num.className="num";num.textContent=String(i+1).padStart(2,"0");
front.appendChild(star);front.appendChild(num);
var back=document.createElement("span");back.className="side back";
var symbol=document.createElement("span");symbol.className="symbol";symbol.textContent=data[0];
var name=document.createElement("span");name.className="name";name.textContent=data[1];back.appendChild(symbol);back.appendChild(name);
inner.appendChild(front);inner.appendChild(back);button.appendChild(inner);
button.addEventListener("click",function(){
var flipped=button.classList.toggle("flipped");button.setAttribute("aria-pressed",flipped?"true":"false");
if(flipped){latest=i;document.getElementById("resultTitle").textContent=data[0]+" "+data[1];document.getElementById("resultText").textContent=data[2];result.classList.add("show");}
else if(latest===i){latest=null;result.classList.remove("show");}
});deck.appendChild(button);
});
document.getElementById("again").addEventListener("click",function(){deck.querySelectorAll(".tile").forEach(function(b){b.classList.remove("flipped");b.setAttribute("aria-pressed","false");});latest=null;result.classList.remove("show");deck.scrollIntoView({behavior:"smooth",block:"start"});});
document.getElementById("share").addEventListener("click",async function(){
if(latest===null)return;var c=cards[latest],msg="我在薇光 AI 課堂抽到「"+c[1]+"」："+c[2],url=location.href;
try{if(navigator.share){await navigator.share({title:"今天的能量抽卡",text:msg,url:url});}
else if(navigator.clipboard){await navigator.clipboard.writeText(msg+"\n"+url);alert("抽卡結果已複製！");}
else{prompt("請複製分享：",msg+"\n"+url);}
}catch(e){if(e.name!=="AbortError")prompt("請複製分享：",msg+"\n"+url);}
});
})();
</script></body></html>
